<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Signup • Rent Some Orders</title><link rel="stylesheet" href="../assets/css/styles.css?v=rental-ux-v34"></head><body><div class="login-shell"><div class="login-card" style="max-width:680px;"><div class="eyebrow">Private Employee Signup</div><h1>Create your employee account</h1><p class="muted">Your account will remain pending until an administrator approves it.</p><form id="employeeSignupForm" class="form-grid"><div class="form-row two"><div class="form-row"><label>First name</label><input name="firstName" required></div><div class="form-row"><label>Last name</label><input name="lastName" required></div></div><div class="form-row"><label>Pickup location for assigned orders</label><input name="pickupAddress" placeholder="Full street address" required></div><div class="form-row two"><div class="form-row"><label>Phone</label><input name="phone" type="tel" required></div><div class="form-row"><label>Email</label><input name="email" type="email" required></div></div><div class="form-row two"><div class="form-row"><label>Password</label><input name="password" type="password" minlength="8" required></div><div class="form-row"><label>Confirm password</label><input name="confirmPassword" type="password" minlength="8" required></div></div><div class="form-row two"><div class="form-row"><label>Emergency contact name</label><input name="emergencyContactName"></div><div class="form-row"><label>Emergency contact phone</label><input name="emergencyContactPhone" type="tel"></div></div><button class="btn btn-primary" type="submit">Submit for Approval</button><div id="employeeSignupStatus" class="small"></div></form></div></div><script type="module" src="../assets/js/app-employee-signup.js"></script></body></html>
