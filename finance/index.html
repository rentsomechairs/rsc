<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Records | Rent Some Chairs</title><link rel="stylesheet" href="../assets/css/styles.css?v=rental-ux-v60"><link rel="icon" href="../favicon.ico"><style>
.finance-shell{max-width:1500px;margin:auto;padding:18px}.finance-nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.finance-nav button.active{background:#2563eb;color:white}.finance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{padding:16px;border:1px solid #dbe3ef;border-radius:14px;background:white}.metric strong{font-size:1.55rem;display:block;margin-top:6px}.record-table{width:100%;border-collapse:collapse}.record-table th,.record-table td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.record-table th{position:sticky;top:0;background:#f8fafc}.table-wrap{overflow:auto;max-height:62vh}.finance-actions{display:flex;gap:8px;flex-wrap:wrap}.finance-panel{display:none}.finance-panel.active{display:block}.finance-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.finance-form-grid .wide{grid-column:1/-1}.details-box{border:1px solid #dbe3ef;border-radius:12px;padding:12px}.status-chip{display:inline-block;border-radius:999px;padding:3px 8px;background:#eef2ff;font-size:.78rem}.review-warning{background:#fff7ed}.split-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin:6px 0}@media(max-width:700px){.finance-form-grid{grid-template-columns:1fr}.split-row{grid-template-columns:1fr}.record-table{min-width:780px}}
</style></head><body><main class="finance-shell"><div class="section-header"><div><h1>Financial Records</h1><p class="muted">Flexible recordkeeping for tax preparation. Totals are not final tax determinations.</p></div><div class="finance-actions"><a class="btn btn-ghost" href="../admin/index.html">Back to Admin</a><button class="btn btn-primary" id="addBtn">Add Expense</button></div></div><div id="notice"></div><nav class="finance-nav" id="nav"></nav><section id="dashboard" class="finance-panel active"></section><section id="records" class="finance-panel"></section><section id="categories" class="finance-panel"></section><section id="reports" class="finance-panel"></section><section id="trash" class="finance-panel"></section></main><div class="modal-backdrop" id="recordModal"><div class="modal" style="max-width:980px"><div class="section-header"><h2 id="modalTitle">Add Record</h2><button class="btn btn-ghost" data-close>Close</button></div><form id="recordForm"></form></div></div><div class="modal-backdrop" id="financeResetModal">
  <div class="modal" style="max-width:620px">

    <form id="financeResetForm">
      <div class="form-row"><label>Re-enter your Firebase password</label><input type="password" name="password" autocomplete="current-password" required></div>
      <div class="form-row"><label>Second confirmation</label><input name="confirmPhrase" placeholder="Type DELETE ALL FINANCES exactly" autocomplete="off" required></div>
      <label class="form-row" style="display:flex;flex-direction:row;gap:10px;align-items:flex-start"><input type="checkbox" name="finalCheck" style="width:auto;margin-top:4px"><span>I understand this permanently deletes all financial records and cannot be undone.</span></label>
      <div id="financeResetError" class="small" style="color:#b91c1c;margin:10px 0"></div>
      <div class="finance-actions" style="justify-content:flex-end"><button type="button" class="btn btn-ghost" data-close-finance-reset>Cancel</button><button class="btn btn-primary" id="financeResetConfirmBtn" type="submit" disabled>Permanently delete financial records</button></div>
    </form>
  </div>
</div>
